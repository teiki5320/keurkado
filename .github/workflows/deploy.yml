# Vérifie, construit et publie le site statique sur Cloudflare Pages (projet « keurkado », keurkado.com), comme Keurbook.
# Se lance à chaque push sur main, chaque lundi (articles « Conseils » programmés, calendrier à jour)
# et à la main (onglet Actions).
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Chaque lundi à 0 h 15 (heure de Paris en hiver, 1 h 15 en été).
  schedule:
    - cron: "15 23 * * 0"

permissions:
  contents: read
  # Pour réactiver la tâche programmée (voir la dernière étape).
  actions: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (dernière version de main)
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (lint + types)
        run: |
          npm run lint
          npm run typecheck

      - name: Lancer les tests
        run: npm test

      # Génère aussi les épingles Pinterest (public/epingles/) et l'image de partage.
      - name: Construire le site statique (dossier out/)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://keurkado.com
          NEXT_PUBLIC_PINTEREST_VERIFY: ${{ vars.PINTEREST_VERIFY }}
          NEXT_TELEMETRY_DISABLED: 1

      # Les secrets ne sont donnés qu'aux étapes qui en ont besoin (pas à l'installation ni au build).
      - name: Vérifier la présence des secrets Cloudflare
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Ajoutez les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour publier le site."
          fi

      - name: Publier sur Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        env:
          # Réglés par le propriétaire dans Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler est figé dans package-lock.json (installé par npm ci).
          # Crée le projet « keurkado » à la première publication (sans effet s'il existe déjà).
          npx wrangler pages project create keurkado --production-branch=main || true
          npx wrangler pages deploy out --project-name=keurkado --branch=main --commit-dirty=true

      # GitHub coupe les tâches programmées d'un dépôt public après 60 jours sans activité :
      # chaque publication programmée réactive la tâche, pour que les articles continuent de paraître.
      - name: Garder la publication programmée active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
