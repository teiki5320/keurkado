# Vérifie, construit et publie le site statique sur Cloudflare (Worker de fichiers statiques « keurkado », keurkado.com), comme Keur Foot.
# Se lance à chaque push sur main, chaque lundi, mercredi et vendredi (articles « Conseils » programmés, calendrier à jour)
# et à la main (onglet Actions).
name: Publier le site

on:
  push:
    branches: [main]
    # Le passage Pinterest du matin n'enregistre que son fichier d'état : pas besoin de republier le site.
    paths-ignore: [data/pinterest-etat.json]
  workflow_dispatch:
  # Chaque lundi, mercredi et vendredi à 0 h 15 (heure de Paris en hiver, 1 h 15 en été).
  schedule:
    - cron: "15 23 * * 0,2,4"

permissions:
  contents: read
  # Pour réactiver la tâche programmée (voir la dernière étape).
  actions: write

# Une seule publication à la fois ; on ne coupe pas une publication en cours.
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (dernière version de main)
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          # Tout l'historique : la date des pages fixes du sitemap est celle du dernier commit de leurs fichiers.
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code (lint + types)
        run: |
          npm run lint
          npm run typecheck

      - name: Lancer les tests
        run: npm test

      # Génère aussi les épingles Pinterest (public/epingles/) et l'image de partage.
      - name: Construire le site statique (dossier out/)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://keurkado.com
          NEXT_PUBLIC_PINTEREST_VERIFY: ${{ vars.PINTEREST_VERIFY }}
          NEXT_TELEMETRY_DISABLED: 1

      # Contrôle du HTML construit : un seul h1 et une description par page, titre ≤ 60 caractères, adresse canonique,
      # JSON-LD qui se lit, liens Amazon, images réduites, sitemap complet, balises de vérification (tests/sortie/).
      - name: Contrôler le site construit
        run: npm run test:sortie

      # Repère propre à cette publication : la dernière étape vérifie que keurkado.com le sert bien.
      - name: Marquer la version publiée
        run: echo "${GITHUB_SHA} ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > out/version.txt

      # Les secrets ne sont donnés qu'aux étapes qui en ont besoin (pas à l'installation ni au build).
      # Sans eux, la publication échoue (en rouge, avec un e-mail de GitHub) au lieu de passer pour réussie.
      - name: Vérifier la présence des secrets Cloudflare
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Secrets CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID absents : rien n'est publié."
            exit 1
          fi

      - name: Publier sur Cloudflare (keurkado.com)
        env:
          # Réglés par le propriétaire dans Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler est figé dans package-lock.json (installé par npm ci) ; configuration dans wrangler.jsonc.
          # Ne pas utiliser « wrangler pages … » : la commande convertit le projet en application OpenNext.
          npx wrangler deploy

      # Le site en ligne doit servir la version qui vient d'être publiée (jusqu'à 3 minutes d'attente).
      - name: Vérifier que keurkado.com sert la nouvelle version
        run: |
          attendu="$(cat out/version.txt)"
          servi=""
          for i in $(seq 1 18); do
            servi="$(curl -fsS -H 'Cache-Control: no-cache' "https://keurkado.com/version.txt?v=${GITHUB_RUN_ID}-${i}" || true)"
            if [ "$servi" = "$attendu" ]; then
              echo "keurkado.com sert bien la version $attendu"
              exit 0
            fi
            sleep 10
          done
          echo "::error::keurkado.com ne sert pas la nouvelle version (attendu « $attendu », reçu « $servi »)."
          exit 1

      # GitHub coupe les tâches programmées d'un dépôt public après 60 jours sans activité :
      # chaque publication programmée réactive la tâche, pour que les articles continuent de paraître.
      - name: Garder la publication programmée active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
